[pytest]
# Rootdir is this file's directory (project root) no matter where pytest is
# invoked. Adding `backend` to the import path makes both the `app` and
# `blockchain` packages importable whether tests are run from the project
# root or from backend/.
pythonpath = backend
testpaths = backend/tests

# No network calls are allowed from unit tests. Treat a real legacy socket
# connection attempt as failure so providers (Alchemy), Postgres, Neo4j or
# Redis can never slow down or hang a test run.
addopts = -p no:cacheprovider
