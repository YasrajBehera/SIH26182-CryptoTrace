services:
  postgres:
    image: postgres:16
    container_name: cryptotrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptotrace
      POSTGRES_USER: cryptotrace
      POSTGRES_PASSWORD: cryptotrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptotrace -d cryptotrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: cryptotrace-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/change_me
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build:
      context: ./backend
    container_name: cryptotrace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://cryptotrace:cryptotrace@postgres:5432/cryptotrace
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: change_me
      # Never commit real keys. Provide these at runtime if live data is needed.
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_PROXY_TARGET: http://backend:8000
    container_name: cryptotrace-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "4173:4173"

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs: